name: One-time docentes schema hotfix

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/hotfix-docentes-schema.yml

permissions:
  contents: write

jobs:
  hotfix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Guard optional docentes schema method
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('template-parts/oferta/default.php')
          text = path.read_text()
          old = (
              "                    $docentes_grupos = class_exists('Oferta_Data_Schema')\n"
              "                        ? Oferta_Data_Schema::get_docentes_grupos($post_id)\n"
              "                        : [];\n"
          )
          new = (
              "                    $docentes_grupos = class_exists('Oferta_Data_Schema')\n"
              "                        && method_exists('Oferta_Data_Schema', 'get_docentes_grupos')\n"
              "                        ? Oferta_Data_Schema::get_docentes_grupos($post_id)\n"
              "                        : [];\n"
          )
          count = text.count(old)
          if count != 1:
              raise SystemExit(f'Expected exactly one target block, found {count}')
          path.write_text(text.replace(old, new, 1))
          PY

          php -l template-parts/oferta/default.php

      - name: Commit hotfix to main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add template-parts/oferta/default.php
          git rm .github/workflows/hotfix-docentes-schema.yml
          git commit -m "fix(theme): guard docentes schema method"
          git push origin HEAD:main
